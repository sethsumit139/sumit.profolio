<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SPECIFICITY </title>
</head>
<style>
    /* score 1 : elements  */
    p{
        color: red;
    }
    /* score 10 : class  */

    .myclass{
        color:orange;
    }


    /* score 100: ID */
    #unique{
        color:blue
    }
/* class(10)+id(100)=110*/
    #unique.myclass{
        color: brown;
    }
</style>
<body>
    <P id="unique" class="myclass">i am a para</P>
    <p class="myclass"> para 2  </p>
    <p>para 3</p>
</body>
</html>
