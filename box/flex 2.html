<!DOCTYPE html>
<html lang="en">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Document</title>
 </head>
 <body>
   <style>
     .flex-container {
       display: flex;
       border: 3px solid #333;
       height: 200px;
       align-items: flex-start; /* Everyone starts at the top */
     }


     .item {
       background-color: #03a9f4;
       color: white;
       padding: 20px;
       margin: 5px;
       font-weight: bold;
     }


     /* The "Special" Item */
     .special-item {
       background-color:orange;
       order: -1;
       flex-basis: 400px;
     }
   </style>


   <div class="flex-container">
     <div class="item">Item 1 (Order: 0)</div>
     <div class="item special-item">Item 2 (The Rebel)</div>
     <div class="item">Item 3 (Order: 0)</div>
   </div>
 </body>
</html>
