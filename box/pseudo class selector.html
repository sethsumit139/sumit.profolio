<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSEDO CLASS SELECTOR</title>
</head>
<style>
    .my-btton{
        padding: 15px 30px;
        font-size: 18px;
        background-color: rgb(24, 1, 46);
        color: white;
        border-radius: 10px;
        cursor: pointer;

    }
    .my-btton:hover{
        background-color: aqua;
        transform: scale(1.05);
    }
    .my-btton:focus{
        border: 3px solid yellow;
    }
    .my-btton:active{
        transform: scale(0.5);
    }

</style>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <a href="https://codepen.io/pen/" target="_blank" class="my-btton">im button</a>
         <p>im para (hover, click, tab key press)</p>
    </div>
    
</body>
</html>
