<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }
        .item{
            background-color: rgb(231, 182, 121);
            color: navy;
            text-align: center;
            padding: 20px;
        }
        .feature{
            grid-column: 1/3;
            grid-row: 1/3;
            background-color: black;
            color: whitesmoke;
            

        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item feature">item 1</div>
        <div class="item">item 2-- sidebar</div>
        <div class="item">item 3</div>
        <div class="item">item 4</div>
    </div>
    
</body>
</html>
