<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation eski library hiti hai depk knowledge ke liye </title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 50px;
            /* animation: pluse;
            animation-duration: 2s;
            animation-iteration-count: infinite; */

            animation: pluse 10s 4ms infinite; 
            /* SHORT CUT FOR SAME AAPLY FEATURES  */

        }
        @keyframes pluse{
            0%{
                background-color: red;
                transform: scale(1);

            }
            50%{
                background-color: rgb(100, 194, 13);
                transform: scale(1.8);

            }
            100%{
                background-color: red;
                transform: scale(1);

            }

        }

    </style>
</head>
<body>
    <section>
        <h3>this is simple animation</h3>
        <div class="box"></div>
    </section>
    
</body>
</html>
